<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ app_name | default("Cable Web") }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <!-- HTMX vendored locally (no CDN dependency — works offline / on any network). -->
  <script src="/static/js/htmx.min.js"></script>
  <script>
    // htmx 2 defaults to swap:false for 4xx/5xx, which silently DISCARDS every
    // error fragment the app renders (bad workbook, failed generation, …) — the
    // user just sees nothing happen. Our 4xx/5xx bodies are rendered UI states
    // (_error.html), so swap them in like any other response.
    htmx.config.responseHandling = [
      { code: "204", swap: false },
      { code: "[23]..", swap: true },
      { code: "[45]..", swap: true, error: true },
    ];
  </script>
  <!-- Drag-and-drop for the Add-module control (delegated; survives HTMX swaps). -->
  <script src="/static/js/dropzone.js" defer></script>
  <!-- Tabbed analysis page (delegated; survives HTMX swaps). -->
  <script src="/static/js/tabs.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">⚡</span>
      <span class="brand-text">Cable&nbsp;Web</span>
    </a>
    <nav class="topnav">
      {% if user %}
      <a href="/projects">Projects</a>
      {% if user.is_admin %}<a href="/sam/modules">Module library</a><a href="/admin/users">Users</a>{% endif %}
      <span class="user-chip" title="{{ user.email }}">{{ user.name or user.email }}</span>
      <form method="post" action="/logout" class="logout-form"><button type="submit">Sign out</button></form>
      {% endif %}
    </nav>
  </header>

  <main class="content">
    {% block breadcrumb %}{% endblock %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>{{ app_name | default("Cable Web") }}</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
