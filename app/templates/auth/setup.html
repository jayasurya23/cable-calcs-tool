{% extends "base.html" %}
{% block title %}First-run setup — Cable Web{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Welcome 👋</h1>
  <p class="subtitle">No accounts exist yet — create the administrator account to get started.</p>
  {% if error %}<div class="warning">⚠ {{ error }}</div>{% endif %}
  <form method="post" action="/setup">
    <div class="field">
      <label for="name">Full name</label>
      <input class="auth-input" type="text" id="name" name="name" required autofocus>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input class="auth-input" type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="password">Password <span class="dims">(min 8 characters)</span></label>
      <input class="auth-input" type="password" id="password" name="password" minlength="8" required>
    </div>
    <button type="submit" class="btn btn-primary">Create admin account</button>
  </form>
</section>
{% endblock %}
