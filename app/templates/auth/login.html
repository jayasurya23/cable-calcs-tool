{% extends "base.html" %}
{% block title %}Sign in — Cable Web{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Sign in</h1>
  <p class="subtitle">Cable Web — PV engineering tools</p>
  {% if error %}<div class="warning">⚠ {{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="email">Email</label>
      <input class="auth-input" type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="auth-input" type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</section>
{% endblock %}
